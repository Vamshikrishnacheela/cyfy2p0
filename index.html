    <meta name="theme-color" content="#081217" />
    <!-- Apply the saved or system theme before first paint so light-mode visitors do not see a dark flash (see ThemeToggle.tsx) -->
    <script>
      try {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'light') document.documentElement.classList.add('light');
      } catch (e) {}
    </script>
