    <!-- Dark by default. Apply a saved light choice before first paint, and paint the dark background before the stylesheet loads, so neither theme flashes (see ThemeToggle.tsx) -->
    <style>html:not(.light) { background: #081217; color-scheme: dark; }</style>
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
      } catch (e) {}
    </script>
